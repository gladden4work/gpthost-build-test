name: GPTHost Build Pipeline (Worker Upload)

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Project ID
        required: true
        type: string
      source_files:
        description: Prepared source JSON (path to content)
        required: true
        type: string
      source_files_url:
        description: Worker URL for an oversized prepared source bundle
        required: false
        type: string
      callback_url:
        description: Owner-scoped Worker callback URL
        required: true
        type: string
      framework:
        description: Prepared project framework
        required: true
        type: string
      correlation_id:
        description: Project operation ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Retrieve prepared source without executing it
        env:
          SOURCE_FILES: ${{ inputs.source_files }}
          SOURCE_FILES_URL: ${{ inputs.source_files_url }}
          SOURCE_JSON: ${{ runner.temp }}/source.json
          PROJECT_ID: ${{ inputs.project_id }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_ORIGIN: https://gpthost-builder-staging.gladden4work.workers.dev
          CALLBACK_TOKEN: ${{ secrets.GPTHOST_CALLBACK_TOKEN }}
        run: |
          node pipeline/pipeline.mjs prepare
          cp pipeline/pipeline.mjs "$RUNNER_TEMP/pipeline.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source.json
            ${{ runner.temp }}/pipeline.mjs
          if-no-files-found: error
          retention-days: 1

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source
      - name: Build the prepared project
        env:
          SOURCE_JSON: ${{ runner.temp }}/source/source.json
          PROJECT_DIRECTORY: ${{ runner.temp }}/project
          PROJECT_ID: ${{ inputs.project_id }}
          FRAMEWORK: ${{ inputs.framework }}
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/output
          BUILD_ARCHIVE: ${{ runner.temp }}/build.tar.gz
        run: node "$RUNNER_TEMP/source/pipeline.mjs" build
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/build.tar.gz
          if-no-files-found: error
          retention-days: 1

  deliver:
    if: ${{ always() }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: pipeline
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        id: download
        if: ${{ needs.build.result == 'success' }}
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact
      - name: Deliver artifact or report build failure
        if: ${{ always() }}
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          CALLBACK_ORIGIN: https://gpthost-builder-staging.gladden4work.workers.dev
          CALLBACK_TOKEN: ${{ secrets.GPTHOST_CALLBACK_TOKEN }}
          PROJECT_ID: ${{ inputs.project_id }}
          CORRELATION_ID: ${{ inputs.correlation_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_RESULT: ${{ needs.build.result == 'success' && steps.download.outcome == 'success' && 'success' || 'failure' }}
          BUILD_ARCHIVE: ${{ runner.temp }}/artifact/build.tar.gz
        run: node pipeline/pipeline.mjs deliver
